{{ with resources.Get (.Get "img") }}
  {{ if eq .MediaType.SubType "svg" }}
    <img src="{{ .RelPermalink }}" style="width: 100%; max-height: 24rem; object-fit: contain;">
  {{ else }}
    {{ with .Resize "1600x webp picture q90" }}
      <img src="{{ .RelPermalink }}" style="width: 100%; max-height: 24rem; object-fit: contain;">
    {{ end }}
  {{ end }}
{{ end }}
